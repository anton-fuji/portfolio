name: Security

on:
  pull_request:
    branches:
      - main
    paths:
      - 'package.json'
      - 'package-lock.json'
      - '.npmrc'
      - '.github/**'
      - 'renovate.json'
  push:
    branches:
      - main
    paths:
      - 'package.json'
      - 'package-lock.json'
      - '.npmrc'
      - '.github/**'
      - 'renovate.json'
  schedule:
    - cron: '0 19 * * 0'
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  osv-scan:
    name: OSV Scan
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@8deb546fdb875b9996d27d4950be7312dac076a1 # v2.5.0
    with:
      scan-args: |-
        --lockfile=package-lock.json
